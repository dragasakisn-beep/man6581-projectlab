<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MAN-6581 ProjectLab</title>
<style>
:root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#172c3b;background:#f3f7f8;--navy:#112b62;--forest:#07564d;--teal:#079a9c;--gold:#dea81d;--line:#dfe9eb}*{box-sizing:border-box}body{margin:0;background:#f3f7f8;color:#172c3b}header{background:#fff;border-bottom:4px solid var(--gold);padding:0 3.5%;min-height:110px;display:flex;align-items:center;justify-content:space-between;position:relative;overflow:hidden;gap:30px}header::before{content:"";position:absolute;bottom:0;left:0;width:42%;height:4px;background:var(--teal)}header::after{content:"";position:absolute;right:-12px;top:-30px;width:175px;height:190px;transform:skew(-32deg);background:linear-gradient(90deg,#007a78 0 39%,#034b47 39% 69%,#dfa820 69%);opacity:.95}header .brand{display:flex;align-items:center;gap:22px;z-index:1;min-width:0}header .eu{font-size:20px;color:var(--forest);font-family:Georgia,serif;line-height:1.05;font-weight:bold;border-right:2px solid var(--gold);padding-right:19px;white-space:nowrap}header .course-title{color:var(--navy);font-size:25px;letter-spacing:-.5px;font-weight:800}header .subtitle{font-size:13px;color:#38677a;margin-top:5px}header .version{margin-right:190px;white-space:nowrap;color:#5b6b78;font-size:12px;z-index:1}main{max-width:1480px;margin:24px auto;padding:0 20px}.layout{display:grid;grid-template-columns:286px minmax(0,1fr);gap:22px;align-items:start}nav,.panel{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 8px 28px rgba(17,43,98,.045)}nav{padding:14px;position:sticky;top:14px;max-height:calc(100vh - 32px);overflow:auto}nav .nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:#68808c;font-weight:800;margin:13px 12px 9px}nav button{display:flex;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:12px 12px;margin:2px 0;border-radius:10px;cursor:pointer;color:#294d60;font-size:13px;font-weight:500;line-height:1.35}nav button:hover{background:#eef8f7}nav button.active{background:#dbf1eb;font-weight:750;color:#07574c;border-left:3px solid var(--teal)}nav button.start{background:#0b6257;color:#fff;font-weight:800;font-size:14px;justify-content:center;margin-bottom:10px;padding:15px}nav button.start.active{background:#0a6559;color:#fff;border:0}.panel{padding:32px 35px;min-height:650px}h1{font-size:clamp(24px,2.4vw,35px);line-height:1.2;color:var(--navy);margin:8px 0 18px;letter-spacing:-.6px}h2{color:var(--navy);margin-top:30px;font-size:20px}h3{color:var(--forest)}.eyebrow{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:#537781;font-weight:800}.muted{font-size:13px;color:#5d7480;line-height:1.6}.note{padding:16px;background:#fff8e8;border-left:4px solid var(--gold);border-radius:7px;margin:18px 0;line-height:1.5}label{display:block;font-weight:700;margin:20px 0 7px;color:#234357;font-size:14px}input:not([type=checkbox]),textarea,select{display:block;width:100%;padding:12px 13px;border:1px solid #b9cdd2;border-radius:8px;background:#fff;font:inherit;color:#203949}textarea{min-height:90px;resize:vertical}button.action{background:var(--forest);color:white;border:0;border-radius:9px;padding:12px 17px;cursor:pointer;margin:12px 9px 8px 0;font-weight:700;font-size:13px}.secondary{background:#eaf3f6!important;color:#12385f!important}.danger{background:#a42e3d!important}button:hover{filter:brightness(.97)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #dcb034;outline-offset:2px}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:22px 0}.metric{background:linear-gradient(140deg,#eef8f8,#f7fafc);border:1px solid #dae9ee;border-radius:12px;padding:20px}.metric strong{display:block;font-size:30px;color:var(--navy);margin-bottom:4px}.metric span{color:#617b86;font-size:12px}.progress-outer{width:100%;height:16px;background:#e5ecef;border-radius:20px;overflow:hidden}.progress-inner{height:100%;background:linear-gradient(90deg,#087f75,#0da1a4);border-radius:20px;transition:width .3s}.chapter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:9px;margin:17px 0 25px}.chapter-tile{border:1px solid #dce8ec;border-radius:9px;padding:10px;background:#fff}.chapter-tile.done{border-color:#a4d7bf;background:#effaf3}.chapter-tile strong{font-size:12px;display:block}.chapter-tile span{font-size:11px;color:#607d88}.chart{display:flex;align-items:flex-end;gap:12px;height:220px;border-bottom:1px solid #b6c8d1;margin:30px 0 48px;padding:10px 5px}.chart-item{flex:1;min-width:38px;position:relative;background:linear-gradient(180deg,#0ba5a4,#0b5b58);border-radius:5px 5px 0 0}.chart-item span{position:absolute;top:-23px;left:0;width:100%;text-align:center;font-size:11px;color:#183954}.chart-item small{position:absolute;bottom:-38px;left:0;width:100%;text-align:center;font-size:10px;overflow-wrap:anywhere}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #dbe7df;vertical-align:top}th{color:#17465a;background:#f0f6f7}.report-record{padding:11px 0;border-bottom:1px solid #e5eeee;white-space:pre-wrap;overflow-wrap:anywhere}.report-record b{display:block;margin-bottom:4px;color:#25536a}.report-chapter{page-break-inside:avoid;break-inside:avoid;margin:26px 0}.report-meta{padding:18px;border:1px solid #dbe7ee;background:#f7fafc;border-radius:10px}footer{text-align:center;font-size:12px;color:#647d83;margin:25px 0}.tiny{font-size:11px;color:#64818a}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}a{color:#066b70}@media(max-width:950px){.layout{grid-template-columns:1fr}nav{position:static;max-height:240px}header .course-title{font-size:19px}header .version{margin-right:110px}header::after{width:110px}}@media(max-width:600px){header{padding:16px;min-height:95px}header .eu{font-size:15px;padding-right:12px}header .brand{gap:12px}header .course-title{font-size:16px}header .version,header::after{display:none}.panel{padding:20px}.metrics{grid-template-columns:1fr}}@media print{body{background:#fff}header,nav,footer,.no-print,button,.action{display:none!important}main,.layout,.panel{display:block!important;margin:0!important;padding:0!important;border:0!important;box-shadow:none!important;max-width:none!important}.report-chapter{break-inside:auto}.report-chapter h2{break-after:avoid}.report-record{break-inside:avoid}h1{font-size:22pt}.metrics{grid-template-columns:repeat(3,1fr)}@page{size:letter;margin:0.65in}}</style></head><body><header><div class="brand"><div class="eu">EU<br>Everglades<br>University</div><div><div class="course-title">MAN-6581 · PROJECT MANAGEMENT</div><div class="subtitle">ProjectLab | Contemporary Project Management: Plan-Driven and Agile Approaches, Fifth Edition</div></div></div><span class="version">PROJECTLAB v0.1.2</span></header><main><div class="layout"><nav id="nav" aria-label="Laboratory chapters"></nav><section id="view" class="panel" aria-live="polite"></section></div></main><footer>Local-first educational prototype. Save a JSON backup every session. No server-side student accounts.</footer>
<script>
'use strict';
const chapters={"3": ["Chartering Projects", [["Business case", "textarea", "Why is this venture needed?"], ["Project purpose and measurable objective", "textarea", "Describe the deliverable and success metric"], ["Sponsor and project manager", "text", "Identify accountability"], ["Constraints and assumptions", "textarea", "Budget, dates, assumptions"], ["Acceptance and success criteria", "textarea", "What constitutes approval?"]]], "4": ["Organizational Capability: Structure, Culture, and Roles", [["Organizational structure", "select", "Functional|Matrix|Projectized|Hybrid"], ["Sponsor responsibilities", "textarea", ""], ["Responsibility Assignment Matrix (RAM) — RACI", "textarea", "Responsible: Who does the work; Accountable: Who owns the result; Consulted: Who provides input; Informed: Who needs updates. Record assignments for three deliverables."], ["Cultural or governance concern", "textarea", ""]]], "5": ["Leading and Managing Project Teams", [["Team roles and capabilities", "textarea", ""], ["Leadership challenge", "select", "Conflict|Underperformance|Turnover|Distributed team"], ["Decision and rationale", "textarea", ""], ["Follow-up metric", "text", ""]]], "6": ["Stakeholder Analysis and Communication Planning", [["Stakeholder register (name, interest, influence)", "textarea", ""], ["Top stakeholder expectations", "textarea", ""], ["Communication strategy and frequency", "textarea", ""], ["Escalation protocol", "textarea", ""]]], "7": ["Holistic Scope Planning", [["Scope statement", "textarea", ""], ["In-scope deliverables", "textarea", ""], ["Out-of-scope exclusions", "textarea", ""], ["Three-level WBS", "textarea", "Numbered breakdown 1 > 1.1 > 1.1.1"], ["Scope acceptance criteria", "textarea", ""]]], "8": ["Scheduling Projects", [["Major milestones and dates", "textarea", ""], ["Activity network / dependencies", "textarea", "List activity, predecessor, duration in days"], ["Critical-path reasoning", "textarea", ""], ["Schedule baseline (days)", "number", ""]]], "9": ["Resourcing and Accelerating Projects", [["Resource assignments", "textarea", ""], ["Resource constraint", "textarea", ""], ["Crashing or fast-tracking alternative", "textarea", ""], ["Revised schedule duration (days)", "number", ""]]], "10": ["Budgeting Projects", [["Equipment ($)", "number", ""], ["Facilities ($)", "number", ""], ["Labor ($)", "number", ""], ["Technology ($)", "number", ""], ["Marketing ($)", "number", ""], ["Contingency ($)", "number", ""], ["Cost assumptions", "textarea", ""]]], "11": ["Project Uncertainty Planning", [["Five risks with likelihood and impact (1–5)", "textarea", ""], ["Highest-priority risk", "text", ""], ["Response plan and owner", "textarea", ""], ["Opportunity and exploitation strategy", "textarea", ""]]], "12": ["Project Quality Planning and Project Kick-off", [["Quality standards and metrics", "textarea", ""], ["Acceptance test / inspection", "textarea", ""], ["Kick-off agenda and roles", "textarea", ""], ["Launch go/no-go criteria", "textarea", ""]]], "13": ["Project Procurement and Partnering", [["Make-or-buy decision", "textarea", ""], ["Vendor comparison and weighted criteria", "textarea", ""], ["Recommended vendor and justification", "textarea", ""], ["Contract and supplier risk", "textarea", ""]]], "14": ["Determining Project Progress and Results", [["Planned value PV ($)", "number", ""], ["Earned value EV ($)", "number", ""], ["Actual cost AC ($)", "number", ""], ["Performance interpretation", "textarea", ""], ["Corrective action", "textarea", ""]]], "15": ["Finishing the Project and Realizing the Benefits", [["Deliverables accepted and exceptions", "textarea", ""], ["Business benefits and measurement", "textarea", ""], ["Transition owner and handover", "textarea", ""], ["Lessons learned", "textarea", ""], ["Final recommendation", "select", "Launch|Conditional launch|Do not launch"]]]};
const sectors=['Food & Hospitality','Technology & Digital Services','Retail & E-commerce','Professional Services','Health & Wellness','Construction & Real Estate','Events & Entertainment','Education & Training','Transportation & Logistics','Other'];
const STORAGE='man6581-projectlab-v011'; const APP_VERSION='0.1.2';
function empty(){return {schemaVersion:1,name:'',sector:'',venture:'',problem:'',customers:'',objective:'',chapters:{},history:[]};}
let data=empty();try{let raw=localStorage.getItem(STORAGE)||localStorage.getItem('man6581-projectlab');if(raw){let parsed=JSON.parse(raw);data={...empty(),...parsed,chapters:parsed.chapters||{},history:parsed.history||[]};}}catch(e){console.warn('Saved project is unreadable',e);}
if(data.chapters?.[4] && data.chapters[4]['RACI: Responsible / Accountable / Consulted / Informed']!==undefined && data.chapters[4]['Responsibility Assignment Matrix (RAM) — RACI']===undefined){data.chapters[4]['Responsibility Assignment Matrix (RAM) — RACI']=data.chapters[4]['RACI: Responsible / Accountable / Consulted / Informed'];}
let page=data.sector?'dashboard':'setup';
const el=id=>document.getElementById(id);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dollars=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(Number(n)||0);
const fieldID=(ch,index)=>'f-'+ch+'-'+index;
function persist(){localStorage.setItem(STORAGE,JSON.stringify(data));}
function setPage(p){if(!data.sector&&p!=='setup'&&p!=='files'){alert('Choose and save a business area first.');page='setup';}else page=p;render();window.scrollTo(0,0);}
function render(){
if(!data.sector&&page!=='setup'&&page!=='files')page='setup';
const nav=[['setup','Start Here · Business Venture Setup'],['dashboard','Dashboard & Charts'],...Object.entries(chapters).map(([n,c])=>[n,c[0]+' (Ch. '+n+')']),['report','Full Project Report / PDF'],['files','Import / Export']];
el('nav').innerHTML='<div class="nav-label">PROJECT WORKSPACE</div>'+nav.map(([p,t],i)=>'<button type="button" data-page="'+p+'" class="'+(i===0?'start ':'')+(String(page)===String(p)?'active':'')+'">'+escapeHTML(t)+'</button>').join('');
el('nav').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
if(page==='setup')return renderSetup();if(page==='dashboard')return renderDashboard();if(page==='report')return renderReport();if(page==='files')return renderFiles();return renderChapter(Number(page));
}
function renderSetup(){el('view').innerHTML=`<div class="eyebrow">START HERE · PROJECT FOUNDATION</div><h1>Choose Your Business Venture</h1><p class="muted">Complete this once before starting Chapter 3. The same venture is used throughout every chapter.</p><label for="name">Student or team name *</label><input id="name" value="${escapeHTML(data.name)}"><label for="sector">Business sector *</label><select id="sector"><option value="">Select a business area</option>${sectors.map(s=>`<option ${s===data.sector?'selected':''}>${escapeHTML(s)}</option>`).join('')}</select><label for="venture">Business concept / venture name *</label><input id="venture" value="${escapeHTML(data.venture)}" placeholder="Example: Mobile automobile detailing"><label for="problem">Business opportunity or customer problem *</label><textarea id="problem">${escapeHTML(data.problem)}</textarea><label for="customers">Target customers *</label><input id="customers" value="${escapeHTML(data.customers)}"><label for="objective">Six-month project objective *</label><textarea id="objective">${escapeHTML(data.objective)}</textarea><div class="note">Changing the business after completing chapters may invalidate earlier decisions.</div><button class="action" id="saveSetup">Save Venture & Begin Chapter 3</button>`;el('saveSetup').onclick=()=>{let vals=Object.fromEntries(['name','sector','venture','problem','customers','objective'].map(k=>[k,el(k).value.trim()]));if(Object.values(vals).some(v=>!v)){alert('Complete all required business setup fields.');return;}let changed=data.venture&&data.venture!==vals.venture&&Object.keys(data.chapters).length;if(changed&&!confirm('Business changed. Review prior chapter content for consistency. Continue?'))return;Object.assign(data,vals);persist();setPage('3');};}
function renderChapter(n){let c=chapters[n];if(!c){setPage('dashboard');return;}let saved=data.chapters[n]||{};let fields=c[1].map(([label,type,placeholder],i)=>{let val=String(saved[label]??'');let id=fieldID(n,i);let control=type==='textarea'?`<textarea id="${id}" placeholder="${escapeHTML(placeholder)}">${escapeHTML(val)}</textarea>`:type==='select'?`<select id="${id}"><option value="">Select an option</option>${placeholder.split('|').map(o=>`<option value="${escapeHTML(o)}" ${o===val?'selected':''}>${escapeHTML(o)}</option>`).join('')}</select>`:`<input type="${type}" id="${id}" ${type==='number'?'min="0" step="any"':''} value="${escapeHTML(val)}" placeholder="${escapeHTML(placeholder)}">`;return `<label for="${id}">${escapeHTML(label)}</label>${control}`;}).join('');el('view').innerHTML=`<p class="muted">MAN-6581 · 30-minute micro-lab</p><h1>Chapter ${n}: ${escapeHTML(c[0])}</h1><p>Business: <strong>${escapeHTML(data.venture)}</strong> · Sector: ${escapeHTML(data.sector)}</p><div class="note"><strong>Guided exercise:</strong> Apply the chapter's project management techniques to your business venture. Record a defensible management decision or calculation. Save the chapter before navigating away.</div>${fields}<label><input type="checkbox" id="done" style="width:auto;display:inline" ${saved.complete?'checked':''}> Mark this laboratory complete</label><button class="action" id="saveChapter">Save Chapter ${n}</button><button class="action secondary" id="toDashboard">Go to Dashboard</button>`;el('saveChapter').onclick=()=>{let record={};c[1].forEach(([label],i)=>record[label]=el(fieldID(n,i)).value);record.complete=el('done').checked;record.updatedAt=new Date().toISOString();data.chapters[n]=record;persist();alert('Chapter '+n+' saved. Export your project JSON after each session.');render();};el('toDashboard').onclick=()=>setPage('dashboard');}
function getBudget(){let x=data.chapters[10]||{};let names=chapters[10][1].filter(v=>v[1]==='number').map(v=>v[0]);return names.map(name=>({name,value:Number(x[name])||0}));}
function renderDashboard(){let done=Object.values(data.chapters).filter(x=>x.complete).length;let budget=getBudget(),total=budget.reduce((n,r)=>n+r.value,0);let ev=data.chapters[14]||{},pv=Number(ev['Planned value PV ($)'])||0,earned=Number(ev['Earned value EV ($)'])||0,ac=Number(ev['Actual cost AC ($)'])||0;let max=Math.max(1,...budget.map(x=>x.value));el('view').innerHTML=`<div class="eyebrow">PROJECT PERFORMANCE</div><h1>Project Dashboard</h1><p><strong>${escapeHTML(data.venture)}</strong> · ${escapeHTML(data.sector)}</p><p class="muted">${escapeHTML(data.name)}</p><div class="metrics"><div class="metric"><strong>${Math.round(done/13*100)}%</strong><span>Overall chapter completion</span></div><div class="metric"><strong>${dollars(total)}</strong><span>Chapter 10 budget</span></div><div class="metric"><strong>${pv?(earned/pv).toFixed(2):'—'}</strong><span>Schedule performance index</span></div></div><h2>Learning & Project Completion</h2><div class="progress-outer" role="progressbar" aria-label="Overall chapter completion" aria-valuenow="${Math.round(done/13*100)}" aria-valuemin="0" aria-valuemax="100"><div class="progress-inner" style="width:${done/13*100}%"></div></div><p class="muted">${done} of 13 chapters marked complete</p><div class="chapter-grid">${Object.entries(chapters).map(([n,c])=>`<div class="chapter-tile ${data.chapters[n]?.complete?'done':''}"><strong>Chapter ${n} · ${data.chapters[n]?.complete?'✓ Complete':'○ Pending'}</strong><span>${escapeHTML(c[0])}</span></div>`).join('')}</div><h2>Budget by category</h2><div class="chart" role="img" aria-label="Budget bar chart by expense category">${budget.map(x=>`<div class="chart-item" style="height:${Math.max(2,x.value/max*100)}%"><span>${dollars(x.value)}</span><small>${escapeHTML(x.name.replace(' ($)',''))}</small></div>`).join('')}</div><h2>Performance measurements</h2><table><tr><th>Measure</th><th>Result</th></tr><tr><td>Cost variance (EV − AC)</td><td>${dollars(earned-ac)}</td></tr><tr><td>Schedule variance (EV − PV)</td><td>${dollars(earned-pv)}</td></tr><tr><td>Cost performance index (EV / AC)</td><td>${ac?(earned/ac).toFixed(2):'Not entered'}</td></tr><tr><td>Schedule performance index (EV / PV)</td><td>${pv?(earned/pv).toFixed(2):'Not entered'}</td></tr></table><div class="note">Data comes from Chapters 10 and 14. Empty figures are not evidence of completed project work.</div><button class="action" id="downloadDashboard">Export project backup (JSON)</button><button class="action secondary" id="print">Full Project Report / PDF</button>`;el('downloadDashboard').onclick=exportJSON;el('print').onclick=()=>setPage('report');}
function download(name,body,mime){let blob=new Blob([body],{type:mime});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportJSON(){let stamp=new Date().toISOString().slice(0,10);data.exportedAt=new Date().toISOString(); data.appVersion=APP_VERSION; persist();download('MAN6581-Project-'+stamp+'.json',JSON.stringify(data,null,2),'application/json');}
function exportCSV(){let lines=[['Chapter','Topic','Field','Value']];Object.entries(data.chapters).forEach(([n,obj])=>{for(let [k,v] of Object.entries(obj))if(!['updatedAt','complete'].includes(k))lines.push([n,chapters[n]?.[0]||'',k,String(v)]);});let csv=lines.map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('MAN6581-Project.csv','\ufeff'+csv,'text/csv;charset=utf-8');}
function renderReport(){
const done=Object.keys(chapters).filter(n=>data.chapters[n]?.complete).length;
const budget=getBudget(),total=budget.reduce((n,r)=>n+r.value,0);
const perf=data.chapters[14]||{},pv=Number(perf['Planned value PV ($)'])||0,ev=Number(perf['Earned value EV ($)'])||0,ac=Number(perf['Actual cost AC ($)'])||0;
const block=(title,val)=>'<div class="report-record"><b>'+escapeHTML(title)+'</b>'+escapeHTML(String(val??'')||'Not entered')+'</div>';
const details=[['Student / Team',data.name],['Business Sector',data.sector],['Business Venture',data.venture],['Business Opportunity',data.problem],['Target Customers',data.customers],['Six-Month Objective',data.objective]].map(([k,v])=>block(k,v)).join('');
const sections=Object.entries(chapters).map(([n,c])=>{const saved=data.chapters[n]||{};return '<section class="report-chapter"><h2>Chapter '+n+': '+escapeHTML(c[0])+'</h2><p class="muted">Status: '+(saved.complete?'Complete':'In progress / not started')+' | Last saved: '+escapeHTML(saved.updatedAt?new Date(saved.updatedAt).toLocaleString():'Not yet saved')+'</p>'+c[1].map(([label])=>block(label,saved[label])).join('')+'</section>';}).join('');
el('view').innerHTML='<div class="no-print"><div class="eyebrow">PORTFOLIO EXPORT CENTER</div><h1>Full Project Report</h1><p>Includes venture information, overall progress, budget and performance calculations, and all Chapters 3–15, including unfinished chapters. Select Print / Save as PDF and choose your browser’s PDF destination.</p><button class="action" id="reportPrint">Print / Save Full PDF</button><button class="action secondary" id="reportJSON">Export editable JSON backup</button><div class="note">The PDF is a read-only submission. Keep your JSON backup to continue editing the project in future labs.</div></div><div class="report-meta"><div class="eyebrow">EVERGLADES UNIVERSITY · MAN-6581</div><h1>Business Venture Project Portfolio</h1><p><strong>'+escapeHTML(data.venture||'Business venture not yet selected')+'</strong></p><p>ProjectLab v'+APP_VERSION+' · Report generated '+escapeHTML(new Date().toLocaleString())+'</p></div><h2>Executive Overview</h2>'+details+'<h2>Project Completion & Performance</h2><div class="metrics"><div class="metric"><strong>'+Math.round(done/13*100)+'%</strong><span>Chapters completed ('+done+'/13)</span></div><div class="metric"><strong>'+dollars(total)+'</strong><span>Budget baseline</span></div><div class="metric"><strong>'+(pv?(ev/pv).toFixed(2):'N/A')+'</strong><span>Schedule performance index</span></div></div><div class="progress-outer"><div class="progress-inner" style="width:'+(done/13*100)+'%"></div></div><h3>Cost Categories</h3><table><thead><tr><th>Category</th><th>Budget</th></tr></thead><tbody>'+budget.map(b=>'<tr><td>'+escapeHTML(b.name)+'</td><td>'+dollars(b.value)+'</td></tr>').join('')+'</tbody></table><h3>Earned Value Analysis</h3><table><tbody><tr><td>Planned value</td><td>'+dollars(pv)+'</td></tr><tr><td>Earned value</td><td>'+dollars(ev)+'</td></tr><tr><td>Actual cost</td><td>'+dollars(ac)+'</td></tr><tr><td>Cost variance</td><td>'+dollars(ev-ac)+'</td></tr><tr><td>Schedule variance</td><td>'+dollars(ev-pv)+'</td></tr><tr><td>Cost performance index</td><td>'+(ac?(ev/ac).toFixed(2):'N/A')+'</td></tr></tbody></table><h2>Chapter Laboratory Records</h2>'+sections;
el('reportPrint').onclick=()=>window.print();el('reportJSON').onclick=exportJSON;
}

function renderFiles(){el('view').innerHTML=`<h1>Import / Export Project</h1><p>Download the full project as a <strong>JSON backup after every session</strong>. Use Import JSON to continue on another computer or browser.</p><button class="action" id="json">Export Full Project JSON</button><button class="action secondary" id="csv">Export Fields CSV</button><button class="action secondary" id="pdf">Full Project Report / PDF</button><hr><label for="importFile">Import a previous MAN-6581 JSON backup</label><input id="importFile" type="file" accept=".json,application/json"><button class="action" id="import">Import Project</button><div class="note">Import replaces the current browser project. Export your current project first. No data is uploaded to a server.</div><button class="action danger" id="reset">Reset Browser Project</button>`;el('json').onclick=exportJSON;el('csv').onclick=exportCSV;el('pdf').onclick=()=>setPage('report');el('import').onclick=async()=>{let f=el('importFile').files[0];if(!f){alert('Choose a JSON file.');return;}try{let parsed=JSON.parse(await f.text());if(!parsed||typeof parsed!=='object'||!parsed.chapters||typeof parsed.chapters!=='object'||typeof parsed.venture!=='string'){throw Error('Not a valid ProjectLab file');}if(!confirm('Import will replace this browser project. Continue?'))return;data={...empty(),...parsed};persist();setPage('dashboard');alert('Project imported successfully.');}catch(e){alert('Import failed: '+e.message);}};el('reset').onclick=()=>{if(confirm('Delete the local project in this browser? Export a backup first.')){localStorage.removeItem(STORAGE);localStorage.removeItem('man6581-projectlab');data=empty();setPage('setup');}};}
