<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MAN-6581 ProjectLab</title>
<style>
:root{font-family:Arial,system-ui,sans-serif;color:#193129;background:#f5f7f6}*{box-sizing:border-box}body{margin:0}header{background:#064b3b;color:white;padding:18px 4%;display:flex;justify-content:space-between;align-items:center;gap:12px}header small{color:#d0e9e0}main{max-width:1280px;margin:22px auto;padding:0 16px}.layout{display:grid;grid-template-columns:275px 1fr;gap:18px}nav,.panel{background:white;border:1px solid #dae4df;border-radius:12px;padding:18px}nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px;margin:1px 0;border-radius:7px;cursor:pointer;color:#21483e}nav button.active,nav button:hover{background:#deeee6;font-weight:bold}nav button:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #a7792d;outline-offset:2px}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metric{background:#eaf3ef;border-radius:8px;padding:16px}.metric strong{display:block;font-size:25px}.muted{font-size:13px;color:#556e65}.note{padding:12px;background:#fff9e9;border-left:4px solid #b88732;border-radius:4px;margin:15px 0}label{display:block;font-weight:bold;margin:14px 0 5px}input,textarea,select{display:block;width:100%;padding:11px;border:1px solid #9cb7ab;border-radius:6px;font:inherit}textarea{min-height:88px;resize:vertical}button.action{background:#07654d;color:white;border:0;border-radius:7px;padding:11px 15px;cursor:pointer;margin:10px 8px 6px 0}.secondary{background:#e4efea!important;color:#164537!important}.danger{background:#8b2b2b!important}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:10px;border-bottom:1px solid #dbe7df}.chart{display:flex;align-items:flex-end;gap:12px;height:220px;border-bottom:1px solid #adc0b6;margin:20px 0 40px;padding:10px 5px}.chart-item{flex:1;min-width:38px;position:relative;background:#168268;border-radius:4px 4px 0 0}.chart-item span{position:absolute;top:-22px;left:0;width:100%;text-align:center;font-size:11px}.chart-item small{position:absolute;bottom:-36px;left:0;width:100%;text-align:center;font-size:10px;overflow-wrap:anywhere}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}footer{text-align:center;font-size:12px;color:#647d70;margin:25px 0}h1{margin-top:0}code{background:#e9f0ed;padding:2px 5px}a{color:#08664f}@media(max-width:810px){.layout,.split{grid-template-columns:1fr}.metrics{grid-template-columns:1fr}nav{max-height:190px;overflow:auto}}@media print{header,nav,.no-print,footer{display:none!important}main,.layout,.panel{display:block;border:0;margin:0;padding:0}.chart{break-inside:avoid}}
</style></head><body><header><div><b>EVERGLADES UNIVERSITY · MAN-6581</b><br><small>ProjectLab · Business Venture Management Studio</small></div><span>Prototype v0.1.1</span></header><main><div class="layout"><nav id="nav" aria-label="Laboratory chapters"></nav><section id="view" class="panel" aria-live="polite"></section></div></main><footer>Local-first educational prototype. Save a JSON backup every session. No server-side student accounts.</footer>
<script>
'use strict';
const chapters={"3": ["Chartering Projects", [["Business case", "textarea", "Why is this venture needed?"], ["Project purpose and measurable objective", "textarea", "Describe the deliverable and success metric"], ["Sponsor and project manager", "text", "Identify accountability"], ["Constraints and assumptions", "textarea", "Budget, dates, assumptions"], ["Acceptance and success criteria", "textarea", "What constitutes approval?"]]], "4": ["Organizational Capability: Structure, Culture, and Roles", [["Organizational structure", "select", "Functional|Matrix|Projectized|Hybrid"], ["Sponsor responsibilities", "textarea", ""], ["RACI: Responsible / Accountable / Consulted / Informed", "textarea", "Record responsibilities for three critical deliverables"], ["Cultural or governance concern", "textarea", ""]]], "5": ["Leading and Managing Project Teams", [["Team roles and capabilities", "textarea", ""], ["Leadership challenge", "select", "Conflict|Underperformance|Turnover|Distributed team"], ["Decision and rationale", "textarea", ""], ["Follow-up metric", "text", ""]]], "6": ["Stakeholder Analysis and Communication Planning", [["Stakeholder register (name, interest, influence)", "textarea", ""], ["Top stakeholder expectations", "textarea", ""], ["Communication strategy and frequency", "textarea", ""], ["Escalation protocol", "textarea", ""]]], "7": ["Holistic Scope Planning", [["Scope statement", "textarea", ""], ["In-scope deliverables", "textarea", ""], ["Out-of-scope exclusions", "textarea", ""], ["Three-level WBS", "textarea", "Numbered breakdown 1 > 1.1 > 1.1.1"], ["Scope acceptance criteria", "textarea", ""]]], "8": ["Scheduling Projects", [["Major milestones and dates", "textarea", ""], ["Activity network / dependencies", "textarea", "List activity, predecessor, duration in days"], ["Critical-path reasoning", "textarea", ""], ["Schedule baseline (days)", "number", ""]]], "9": ["Resourcing and Accelerating Projects", [["Resource assignments", "textarea", ""], ["Resource constraint", "textarea", ""], ["Crashing or fast-tracking alternative", "textarea", ""], ["Revised schedule duration (days)", "number", ""]]], "10": ["Budgeting Projects", [["Equipment ($)", "number", ""], ["Facilities ($)", "number", ""], ["Labor ($)", "number", ""], ["Technology ($)", "number", ""], ["Marketing ($)", "number", ""], ["Contingency ($)", "number", ""], ["Cost assumptions", "textarea", ""]]], "11": ["Project Uncertainty Planning", [["Five risks with likelihood and impact (1–5)", "textarea", ""], ["Highest-priority risk", "text", ""], ["Response plan and owner", "textarea", ""], ["Opportunity and exploitation strategy", "textarea", ""]]], "12": ["Project Quality Planning and Project Kick-off", [["Quality standards and metrics", "textarea", ""], ["Acceptance test / inspection", "textarea", ""], ["Kick-off agenda and roles", "textarea", ""], ["Launch go/no-go criteria", "textarea", ""]]], "13": ["Project Procurement and Partnering", [["Make-or-buy decision", "textarea", ""], ["Vendor comparison and weighted criteria", "textarea", ""], ["Recommended vendor and justification", "textarea", ""], ["Contract and supplier risk", "textarea", ""]]], "14": ["Determining Project Progress and Results", [["Planned value PV ($)", "number", ""], ["Earned value EV ($)", "number", ""], ["Actual cost AC ($)", "number", ""], ["Performance interpretation", "textarea", ""], ["Corrective action", "textarea", ""]]], "15": ["Finishing the Project and Realizing the Benefits", [["Deliverables accepted and exceptions", "textarea", ""], ["Business benefits and measurement", "textarea", ""], ["Transition owner and handover", "textarea", ""], ["Lessons learned", "textarea", ""], ["Final recommendation", "select", "Launch|Conditional launch|Do not launch"]]]};
const sectors=['Food & Hospitality','Technology & Digital Services','Retail & E-commerce','Professional Services','Health & Wellness','Construction & Real Estate','Events & Entertainment','Education & Training','Transportation & Logistics','Other'];
const STORAGE='man6581-projectlab-v011';
function empty(){return {schemaVersion:1,name:'',sector:'',venture:'',problem:'',customers:'',objective:'',chapters:{},history:[]};}
let data=empty();try{let raw=localStorage.getItem(STORAGE)||localStorage.getItem('man6581-projectlab');if(raw){let parsed=JSON.parse(raw);data={...empty(),...parsed,chapters:parsed.chapters||{},history:parsed.history||[]};}}catch(e){console.warn('Saved project is unreadable',e);}
let page=data.sector?'dashboard':'setup';
const el=id=>document.getElementById(id);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dollars=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(Number(n)||0);
const fieldID=(ch,index)=>'f-'+ch+'-'+index;
function persist(){localStorage.setItem(STORAGE,JSON.stringify(data));}
function setPage(p){if(!data.sector&&p!=='setup'&&p!=='files'){alert('Choose and save a business area first.');page='setup';}else page=p;render();window.scrollTo(0,0);}
function render(){
if(!data.sector&&page!=='setup'&&page!=='files')page='setup';
const nav=[['setup','1. Business Venture Setup'],['dashboard','Dashboard & Charts'],...Object.entries(chapters).map(([n,c])=>[n,'Ch. '+n+' · '+c[0]]),['files','Import / Export']];
el('nav').innerHTML=nav.map(([p,t])=>'<button type="button" data-page="'+p+'" class="'+(String(page)===String(p)?'active':'')+'">'+escapeHTML(t)+'</button>').join('');
el('nav').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
if(page==='setup')return renderSetup();if(page==='dashboard')return renderDashboard();if(page==='files')return renderFiles();return renderChapter(Number(page));
}
function renderSetup(){el('view').innerHTML=`<h1>Choose Your Business Venture</h1><p class="muted">Complete this once before starting Chapter 3. The same venture is used throughout every chapter.</p><label for="name">Student or team name *</label><input id="name" value="${escapeHTML(data.name)}"><label for="sector">Business sector *</label><select id="sector"><option value="">Select a business area</option>${sectors.map(s=>`<option ${s===data.sector?'selected':''}>${escapeHTML(s)}</option>`).join('')}</select><label for="venture">Business concept / venture name *</label><input id="venture" value="${escapeHTML(data.venture)}" placeholder="Example: Mobile automobile detailing"><label for="problem">Business opportunity or customer problem *</label><textarea id="problem">${escapeHTML(data.problem)}</textarea><label for="customers">Target customers *</label><input id="customers" value="${escapeHTML(data.customers)}"><label for="objective">Six-month project objective *</label><textarea id="objective">${escapeHTML(data.objective)}</textarea><div class="note">Changing the business after completing chapters may invalidate earlier decisions.</div><button class="action" id="saveSetup">Save Venture & Begin Chapter 3</button>`;el('saveSetup').onclick=()=>{let vals=Object.fromEntries(['name','sector','venture','problem','customers','objective'].map(k=>[k,el(k).value.trim()]));if(Object.values(vals).some(v=>!v)){alert('Complete all required business setup fields.');return;}let changed=data.venture&&data.venture!==vals.venture&&Object.keys(data.chapters).length;if(changed&&!confirm('Business changed. Review prior chapter content for consistency. Continue?'))return;Object.assign(data,vals);persist();setPage('3');};}
function renderChapter(n){let c=chapters[n];if(!c){setPage('dashboard');return;}let saved=data.chapters[n]||{};let fields=c[1].map(([label,type,placeholder],i)=>{let val=String(saved[label]??'');let id=fieldID(n,i);let control=type==='textarea'?`<textarea id="${id}" placeholder="${escapeHTML(placeholder)}">${escapeHTML(val)}</textarea>`:type==='select'?`<select id="${id}"><option value="">Select an option</option>${placeholder.split('|').map(o=>`<option value="${escapeHTML(o)}" ${o===val?'selected':''}>${escapeHTML(o)}</option>`).join('')}</select>`:`<input type="${type}" id="${id}" ${type==='number'?'min="0" step="any"':''} value="${escapeHTML(val)}" placeholder="${escapeHTML(placeholder)}">`;return `<label for="${id}">${escapeHTML(label)}</label>${control}`;}).join('');el('view').innerHTML=`<p class="muted">MAN-6581 · 30-minute micro-lab</p><h1>Chapter ${n}: ${escapeHTML(c[0])}</h1><p>Business: <strong>${escapeHTML(data.venture)}</strong> · Sector: ${escapeHTML(data.sector)}</p><div class="note"><strong>Guided exercise:</strong> Apply the chapter's project management techniques to your business venture. Record a defensible management decision or calculation. Save the chapter before navigating away.</div>${fields}<label><input type="checkbox" id="done" style="width:auto;display:inline" ${saved.complete?'checked':''}> Mark this laboratory complete</label><button class="action" id="saveChapter">Save Chapter ${n}</button><button class="action secondary" id="toDashboard">Go to Dashboard</button>`;el('saveChapter').onclick=()=>{let record={};c[1].forEach(([label],i)=>record[label]=el(fieldID(n,i)).value);record.complete=el('done').checked;record.updatedAt=new Date().toISOString();data.chapters[n]=record;persist();alert('Chapter '+n+' saved. Export your project JSON after each session.');render();};el('toDashboard').onclick=()=>setPage('dashboard');}
function getBudget(){let x=data.chapters[10]||{};let names=chapters[10][1].filter(v=>v[1]==='number').map(v=>v[0]);return names.map(name=>({name,value:Number(x[name])||0}));}
function renderDashboard(){let done=Object.values(data.chapters).filter(x=>x.complete).length;let budget=getBudget(),total=budget.reduce((n,r)=>n+r.value,0);let ev=data.chapters[14]||{},pv=Number(ev['Planned value PV ($)'])||0,earned=Number(ev['Earned value EV ($)'])||0,ac=Number(ev['Actual cost AC ($)'])||0;let max=Math.max(1,...budget.map(x=>x.value));el('view').innerHTML=`<h1>Project Dashboard</h1><p><strong>${escapeHTML(data.venture)}</strong> · ${escapeHTML(data.sector)}</p><p class="muted">${escapeHTML(data.name)}</p><div class="metrics"><div class="metric"><strong>${done}/13</strong>Completed labs</div><div class="metric"><strong>${dollars(total)}</strong>Chapter 10 budget</div><div class="metric"><strong>${pv?(earned/pv).toFixed(2):'—'}</strong>Schedule performance index</div></div><h2>Budget by category</h2><div class="chart" role="img" aria-label="Budget bar chart by expense category">${budget.map(x=>`<div class="chart-item" style="height:${Math.max(2,x.value/max*100)}%"><span>${dollars(x.value)}</span><small>${escapeHTML(x.name.replace(' ($)',''))}</small></div>`).join('')}</div><h2>Performance measurements</h2><table><tr><th>Measure</th><th>Result</th></tr><tr><td>Cost variance (EV − AC)</td><td>${dollars(earned-ac)}</td></tr><tr><td>Schedule variance (EV − PV)</td><td>${dollars(earned-pv)}</td></tr><tr><td>Cost performance index (EV / AC)</td><td>${ac?(earned/ac).toFixed(2):'Not entered'}</td></tr><tr><td>Schedule performance index (EV / PV)</td><td>${pv?(earned/pv).toFixed(2):'Not entered'}</td></tr></table><div class="note">Data comes from Chapters 10 and 14. Empty figures are not evidence of completed project work.</div><button class="action" id="downloadDashboard">Export project backup (JSON)</button><button class="action secondary" id="print">Print / Save as PDF</button>`;el('downloadDashboard').onclick=exportJSON;el('print').onclick=()=>window.print();}
function download(name,body,mime){let blob=new Blob([body],{type:mime});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportJSON(){let stamp=new Date().toISOString().slice(0,10);data.exportedAt=new Date().toISOString();persist();download('MAN6581-Project-'+stamp+'.json',JSON.stringify(data,null,2),'application/json');}
function exportCSV(){let lines=[['Chapter','Topic','Field','Value']];Object.entries(data.chapters).forEach(([n,obj])=>{for(let [k,v] of Object.entries(obj))if(!['updatedAt','complete'].includes(k))lines.push([n,chapters[n]?.[0]||'',k,String(v)]);});let csv=lines.map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('MAN6581-Project.csv','\ufeff'+csv,'text/csv;charset=utf-8');}
function renderFiles(){el('view').innerHTML=`<h1>Import / Export Project</h1><p>Download the full project as a <strong>JSON backup after every session</strong>. Use Import JSON to continue on another computer or browser.</p><button class="action" id="json">Export Full Project JSON</button><button class="action secondary" id="csv">Export Fields CSV</button><button class="action secondary" id="pdf">Print / Save PDF</button><hr><label for="importFile">Import a previous MAN-6581 JSON backup</label><input id="importFile" type="file" accept=".json,application/json"><button class="action" id="import">Import Project</button><div class="note">Import replaces the current browser project. Export your current project first. No data is uploaded to a server.</div><button class="action danger" id="reset">Reset Browser Project</button>`;el('json').onclick=exportJSON;el('csv').onclick=exportCSV;el('pdf').onclick=()=>window.print();el('import').onclick=async()=>{let f=el('importFile').files[0];if(!f){alert('Choose a JSON file.');return;}try{let parsed=JSON.parse(await f.text());if(!parsed||typeof parsed!=='object'||!parsed.chapters||typeof parsed.chapters!=='object'||typeof parsed.venture!=='string'){throw Error('Not a valid ProjectLab file');}if(!confirm('Import will replace this browser project. Continue?'))return;data={...empty(),...parsed};persist();setPage('dashboard');alert('Project imported successfully.');}catch(e){alert('Import failed: '+e.message);}};el('reset').onclick=()=>{if(confirm('Delete the local project in this browser? Export a backup first.')){localStorage.removeItem(STORAGE);localStorage.removeItem('man6581-projectlab');data=empty();setPage('setup');}};}
render();
</script></body></html>
